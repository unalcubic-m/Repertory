name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync --all-groups --frozen
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy library reviews repertory
      - run: uv run pytest
      - run: npm run typecheck
      - run: npm run build
      - run: uv run python manage.py check --settings=repertory.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=repertory.settings.test
