[project]
name = "repertory"
version = "0.0.0"
description = "Private spaced repetition for recognizing music by ear"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "fsrs>=6,<7",
  "mutagen>=1.47,<2",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<6",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "DJ",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "repertory.settings"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
