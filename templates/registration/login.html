{% extends "base.html" %}
{% block title %}Log in · Repertory{% endblock %}
{% block content %}
  <section class="review-shell">
    <p class="eyebrow">Private listening room</p>
    <h1>Welcome back.</h1>
    <form class="form-card" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
